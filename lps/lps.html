<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Word Finder for Letter Puzzles V1.0 by Mihailo Despotovic, Oct 2003</title>
    <style>
        body {
            margin: 0 auto;
            max-width: 760px;
            padding: 16px;
            font-family: system-ui, sans-serif;
            background: #fff;
            color: #000;
        }
        h1 { font-size: 20px; font-weight: bold; }
        .bar { display: flex; gap: 8px; align-items: center; }
        input { font: 14px ui-monospace, monospace; padding: 4px 6px; flex: 1; max-width: 25em; min-width: 0; }
        button { font-size: 14px; padding: 4px 14px; }
        pre {
            border: 1px solid #aaa;
            padding: 8px;
            min-height: 30em;
            white-space: pre-wrap;
            font: 13px/1.4 ui-monospace, monospace;
        }
        /* dark mode: made from the colors above, for when the system is dark */
        @media (prefers-color-scheme: dark) {
            body { background: #121212; color: #e8e8e8; }
            pre { border: 1px solid #6d6d6d; }
        }
    </style>
</head>
<body>
    <h1>Word Finder for Letter Puzzles V1.0 by Mihailo Despotovic, Oct 2003</h1>
    <div class="bar">
        <label for="puzzle">Puzzle:</label>
        <input id="puzzle" value="DSTPYGNEUEIA" spellcheck="false" autocomplete="off">
        <button id="solve">Solve</button>
    </div>
    <pre id="output"></pre>
    <script src="words.js"></script>
    <script src="lps.js"></script>
</body>
</html>
