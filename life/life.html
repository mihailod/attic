<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Conway's Game of Life V1.0 by Mihailo Despotovic, Feb 2011</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #fff;
            color: #000;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        h1 { font-size: 16px; font-weight: normal; margin: 0; }
        canvas {
            image-rendering: pixelated;
            max-width: 100vw;
            height: auto !important;
            aspect-ratio: 500 / 350;
            border: 1px solid #aaa;
            box-sizing: border-box;
        }
        .buttons { display: flex; gap: 8px; }
        button { font-size: 14px; padding: 4px 14px; }
    </style>
</head>
<body>
    <h1>Conway's Game of Life V1.0 by Mihailo Despotovic, Feb 2011</h1>
    <canvas id="board"></canvas>
    <div class="buttons">
        <button id="seed">Seed</button>
        <button id="start">Start</button>
        <button id="next">Next</button>
        <button id="stop">Stop</button>
    </div>
    <script src="life.js"></script>
</body>
</html>
