<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parallel Sum Benchmark by Mihailo Despotovic, June 2007</title>
    <style>
        body {
            margin: 0 auto;
            max-width: 640px;
            padding: 16px;
            font-family: system-ui, sans-serif;
            background: #fff;
            color: #000;
            font-size: 15px;
            line-height: 1.45;
        }
        h1 { font-size: 20px; font-weight: bold; margin: 0 0 8px; }
        .intro { color: #555; margin: 0 0 16px; }
        form { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
        label { display: flex; flex-direction: column; gap: 4px; }
        select { font-size: 15px; padding: 4px 6px; }
        button { font-size: 15px; padding: 5px 16px; }
        #cores { color: #555; font-size: 14px; margin: 12px 0 0; }
        #status { margin: 12px 0 8px; min-height: 1.4em; }
        table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
        th, td { padding: 6px 14px 6px 0; text-align: right; border-bottom: 1px solid #ddd; }
        th { font-weight: 600; border-bottom-color: #999; }
        th:first-child, td:first-child { text-align: left; }
        td.wrong { color: #c00; font-weight: 600; }
        /* dark mode: made from the colors above, for when the system is dark */
        @media (prefers-color-scheme: dark) {
            body { background: #121212; color: #e8e8e8; }
            .intro { color: #aeaeae; }
            #cores { color: #aeaeae; }
            th, td { border-bottom: 1px solid #454545; }
            th { border-bottom-color: #7c7c7c; }
            td.wrong { color: #ff7160; }
        }
    </style>
</head>
<body>
    <h1>Parallel Sum Benchmark by Mihailo Despotovic, June 2007</h1>
    <p class="intro">Adds up a big array of 1s with one worker, then splits the array evenly across several
        workers running at the same time. More processor cores should mean less time — up to a point.</p>
    <form id="form">
        <label>Array size
            <select id="size">
                <option value="10">10 million numbers (80 MB)</option>
                <option value="50" selected>50 million numbers (400 MB)</option>
                <option value="100">100 million numbers (800 MB)</option>
            </select>
        </label>
        <button id="run">Run</button>
    </form>
    <p id="cores"></p>
    <p id="status"></p>
    <table>
        <thead><tr><th>Workers</th><th>Time</th><th>Speed-up</th><th>Sum</th></tr></thead>
        <tbody id="results"></tbody>
    </table>
    <script src="parallelsum.js"></script>
</body>
</html>
