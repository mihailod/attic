<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Euler Solutions by Mihailo Despotovic, March 2009</title>
    <style>
        body {
            margin: 0 auto;
            max-width: 820px;
            padding: 16px;
            font-family: system-ui, sans-serif;
            background: #fff;
            color: #000;
            font-size: 15px;
            line-height: 1.45;
        }
        h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
        .intro { color: #444; margin: 0 0 12px; }
        a { color: #0645ad; text-decoration: none; }
        a:hover { text-decoration: underline; }
        ol { list-style: none; padding: 0; margin: 12px 0 0; }
        li { padding: 10px 0; border-top: 1px solid #ddd; }
        li:last-child { border-bottom: 1px solid #ddd; }
        .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
        .title { font-weight: 600; }
        .file { color: #777; font-size: 12px; font-family: ui-monospace, monospace; margin-left: auto; }
        .run { min-width: 4.5em; }
        .text { margin: 4px 0 0; color: #333; }
        .note { margin: 2px 0 0; color: #8a5a00; font-size: 13px; }
        .output {
            margin: 6px 0 0; padding: 6px 8px; background: #f6f6f6; border: 1px solid #ddd;
            font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
            max-height: 260px; overflow: auto;
        }
    </style>
</head>
<body>
    <h1>Project Euler Solutions by Mihailo Despotovic, March 2009</h1>
    <p class="intro">My solutions to 28 problems from <a href="https://projecteuler.net">Project Euler</a>, written over four days.
        Click Run to see a solution’s output and running time, or <button id="run-all">Run all</button>.
        Problem statements are shortened; the links go to the full problems on projecteuler.net
        (CC BY-NC-SA 4.0).</p>
    <ol id="problems"></ol>
    <script src="names.js"></script>
    <script src="euler.js"></script>
</body>
</html>
