<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Merging Line Segments by Mihailo Despotovic, August 2005</title>
    <style>
        body {
            margin: 0 auto;
            max-width: 680px;
            padding: 16px;
            font-family: system-ui, sans-serif;
            background: #fff;
            color: #000;
            font-size: 15px;
            line-height: 1.45;
        }
        h1 { font-size: 16px; font-weight: normal; margin: 0 0 8px; }
        .intro { color: #555; margin: 0 0 16px; }
        form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        #input { flex: 1; min-width: 12em; font: 15px ui-monospace, monospace; padding: 5px 7px; }
        button { font-size: 15px; padding: 5px 14px; }
        .examples { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; color: #555; }
        .examples button { font: 13px ui-monospace, monospace; padding: 3px 8px; }
        #result { margin: 18px 0 8px; font: 600 16px ui-monospace, monospace; }
        #result.error { color: #c00; font: 15px system-ui, sans-serif; }
        svg { width: 100%; height: auto; display: block; }
        .seg { stroke: #888; stroke-width: 3; stroke-linecap: round; }
        .seg-end { fill: #888; }
        .merged { stroke: #0645ad; stroke-width: 5; stroke-linecap: round; }
        .merged-end { fill: #0645ad; }
        .axis { stroke: #999; stroke-width: 1; }
        .tick { font: 12px system-ui, sans-serif; fill: #555; text-anchor: middle; }
        .label { font: bold 15px system-ui, sans-serif; fill: #0645ad; }
    </style>
</head>
<body>
    <h1>Merging Line Segments by Mihailo Despotovic, August 2005</h1>
    <p class="intro">Line segments on the number line are sorted, and every group that overlaps or touches
        end to end is merged into one. My answer to Electronic Arts' 90-minute Java interview problem.</p>
    <form id="form">
        <input id="input" value="(1,3), (2,4), (4,5)" aria-label="Line segments" spellcheck="false">
        <button>Merge</button>
    </form>
    <div class="examples">Examples:
        <button type="button" data-example="(1,3), (2,4)">(1,3), (2,4)</button>
        <button type="button" data-example="(2,3), (3,4)">(2,3), (3,4)</button>
        <button type="button" data-example="(1,3), (2,4), (4,5)">(1,3), (2,4), (4,5)</button>
        <button type="button" data-example="(1,2), (4,6), (5,7)">(1,2), (4,6), (5,7)</button>
        <button type="button" data-example="(8,9), (1,10), (2,3), (12,14), (13,15)">(8,9), (1,10), (2,3), (12,14), (13,15)</button>
    </div>
    <p id="result"></p>
    <svg id="line" role="img" aria-label="The segments on a number line, with the merged result below them"></svg>
    <script src="segments.js"></script>
</body>
</html>
